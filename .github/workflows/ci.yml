name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24.0"
  NODE_VERSION: "22.12.0"
  PNPM_VERSION: "10.28.2"
  GOLANGCI_LINT_VERSION: "v2.4.0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pin third-party actions to commit SHAs so a tag move or compromised
      # publisher cannot retroactively change what CI runs. The trailing
      # comment mirrors the upstream version for Dependabot upgrades.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.6.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir web run lint

      - name: Type-check frontend
        run: pnpm --dir web run typecheck

      - name: Test frontend
        run: pnpm --dir web run test

      - name: Build frontend
        run: |
          pnpm --dir web run build
          bash scripts/check-web-dist.sh
          # Verify deterministic filenames (no content hashes like index-49-ZvNc1.js)
          # Skip full git diff because UnoCSS CSS output can vary slightly across environments
          if git ls-files --error-unmatch internal/web/dist/assets/index.js internal/web/dist/assets/index.css internal/web/dist/index.html >/dev/null 2>&1; then
            echo "✓ Deterministic filenames verified (index.js, index.css, index.html)"
          else
            echo "✗ Expected deterministic filenames not found"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Repeat Mock NVIDIA race tests
        run: go test -race ./tests/mocknvidia -count=10

      - name: Run Go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Check shell scripts
        run: |
          bash -n scripts/test/live-nvidia.sh
          bash -n scripts/test/compose-acceptance.sh
          bash -n scripts/check-secrets.sh
          bash -n scripts/check-web-dist.sh
          bash -n scripts/deploy/deploy-public.sh
          bash -n scripts/deploy/rollback-public.sh
          bash -n scripts/litestream-manage.sh

      - name: Run Live parser self-test
        timeout-minutes: 2
        run: |
          NVIDIA_ROUTER_LIVE_SELF_TEST=1 bash scripts/test/live-nvidia.sh
          NVIDIA_ROUTER_COMPOSE_SELF_TEST=1 bash scripts/test/compose-acceptance.sh
          NVIDIA_ROUTER_SECRET_SCAN_SELF_TEST=1 bash scripts/check-secrets.sh
          NVIDIA_ROUTER_WEB_DIST_SELF_TEST=1 bash scripts/check-web-dist.sh

      - name: Scan Docker build context for secrets
        run: bash scripts/check-secrets.sh

      # Live NVIDIA tests require an explicit operator invocation with runtime-only credentials.
      # Standard CI intentionally never enables the live build tag.
      - name: Build container image
        run: docker build --tag nvidia-router:ci .

      - name: Run Compose acceptance
        run: bash scripts/test/compose-acceptance.sh

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pin third-party actions to commit SHAs so a tag move or compromised
      # publisher cannot retroactively change what CI runs. The trailing
      # comment mirrors the upstream version for Dependabot upgrades.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.6.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run management E2E
        run: bash tests/e2e/run.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          if-no-files-found: warn
          path: |
            web/test-results
            web/playwright-report
            web/test-results/harness.log
