services:
  app:
    build:
      context: .
    image: nvidia-router:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3756:3756"
    environment:
      NVIDIA_ROUTER_MASTER_KEY: "${NVIDIA_ROUTER_MASTER_KEY:?NVIDIA_ROUTER_MASTER_KEY is required}"
      NVIDIA_ROUTER_INITIAL_ADMIN_PASSWORD: "${NVIDIA_ROUTER_INITIAL_ADMIN_PASSWORD:?NVIDIA_ROUTER_INITIAL_ADMIN_PASSWORD is required}"
      NVIDIA_ROUTER_ADMIN_SECURE_COOKIE: "${NVIDIA_ROUTER_ADMIN_SECURE_COOKIE:-false}"
      NVIDIA_ROUTER_ADMIN_EXTERNAL_ORIGIN: "${NVIDIA_ROUTER_ADMIN_EXTERNAL_ORIGIN:-}"
      NVIDIA_ROUTER_TRUSTED_PROXY_CIDRS: "${NVIDIA_ROUTER_TRUSTED_PROXY_CIDRS:-}"
      NVIDIA_ROUTER_LISTEN_ADDR: "${NVIDIA_ROUTER_LISTEN_ADDR:-0.0.0.0:3756}"
      NVIDIA_ROUTER_DATA_DIR: "${NVIDIA_ROUTER_DATA_DIR:-/data}"
      NVIDIA_ROUTER_TEMP_DIR: "${NVIDIA_ROUTER_TEMP_DIR:-/tmp}"
      NVIDIA_ROUTER_NVIDIA_BASE_URL: "${NVIDIA_ROUTER_NVIDIA_BASE_URL:-https://integrate.api.nvidia.com}"
      NVIDIA_ROUTER_XK_PROXY_URL: "${NVIDIA_ROUTER_XK_PROXY_URL:-}"
      NVIDIA_ROUTER_XK_PROXY_AUTH_KEY: "${NVIDIA_ROUTER_XK_PROXY_AUTH_KEY:-}"
    volumes:
      - nvidia-router-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:3756/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10m

volumes:
  nvidia-router-data:
